<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIに任せる — 定型レポートの委任構造（新デザイン）</title>
<style>
  /* 骨格B: 構造型（slide-design-system.md 参照） */
  .pageno{ font: 12px/1.4 system-ui, sans-serif; color: var(--label); margin-left: auto; }
  .figure{ flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .flow{ display: flex; align-items: stretch; }
  .step{ flex: 1; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--faint); background: var(--surface-2); padding: 16px 16px 0; }
  .step-h{ flex: 1.1; border-top: 2px solid var(--ink); background: var(--surface); }
  .step-h.first{ padding: 16px 20px 0 0; }
  .step-h.last{ padding: 16px 0 0 20px; }
  .s-num{ font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1; color: var(--line); }
  .step-h .s-num{ font-weight: 600; color: var(--ink); }
  .s-name{ font-size: 17px; font-weight: 600; color: var(--muted); }
  .step-h .s-name{ font-size: 20px; color: var(--ink); }
  .s-desc{ font-size: 14px; line-height: 1.6; color: var(--muted); }
  .s-who{ font: 600 11px/1 system-ui, sans-serif; letter-spacing: .16em; color: var(--label); margin-top: auto; padding-bottom: 14px; }
  .step-h .s-who{ color: var(--ink); }
  .arrow{ width: 36px; display: flex; align-items: center; justify-content: center; color: var(--line); font-size: 18px; }
  .legend{ display: flex; align-items: baseline; gap: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .legend span{ font: 12px/1.5 system-ui, sans-serif; color: var(--label); }
  .legend .right{ margin-left: auto; }
  .conclusion{ display: flex; align-items: baseline; gap: 18px; border-top: 2px solid var(--accent); padding-top: 14px; }
  .c-label{ font: 700 12px/1.4 system-ui, sans-serif; letter-spacing: .16em; color: var(--accent); flex-shrink: 0; }
  .c-text{ font-size: 18px; font-weight: 600; line-height: 1.5; color: var(--ink); }
</style>
<link rel="stylesheet" data-shared-slide-shell href="../../assets/shared-slide-shell.css">
<script defer data-shared-slide-shell-script src="../../assets/shared-slide-shell.js"></script>
</head>
<body>
<div class="slide-viewport">
<div class="slide">

  <section class="slide-page is-active" data-slide-page="1">
    <header class="slide-header">
      <span class="kicker">AI役割分担 — タスク委任</span>
      <h1 class="slide-title">AIに任せる — 定型レポートの委任構造</h1>
      <p class="slide-subtitle">ルールが明確で、間違えてもやり直せる仕事。太枠の工程だけが人の判断</p>
    </header>

    <div class="figure">
      <div class="flow">
        <div class="step step-h first">
          <span class="s-num">01</span>
          <span class="s-name">ルールを設計</span>
          <span class="s-desc">指標・手順・出力形式を決める（初回のみ）</span>
          <span class="s-who">人</span>
        </div>
        <div class="arrow">→</div>
        <div class="step">
          <span class="s-num">02</span>
          <span class="s-name">データ取得・集計</span>
          <span class="s-desc">媒体・ツールから自動取得</span>
          <span class="s-who">AI</span>
        </div>
        <div class="arrow">→</div>
        <div class="step">
          <span class="s-num">03</span>
          <span class="s-name">変化点を抽出</span>
          <span class="s-desc">前週比・異常値を検出</span>
          <span class="s-who">AI</span>
        </div>
        <div class="arrow">→</div>
        <div class="step">
          <span class="s-num">04</span>
          <span class="s-name">レポート出力</span>
          <span class="s-desc">仮説候補つきで自動作成</span>
          <span class="s-who">AI</span>
        </div>
        <div class="arrow">→</div>
        <div class="step step-h last">
          <span class="s-num">05</span>
          <span class="s-name">定期的に見直す</span>
          <span class="s-desc">目的に合っているか点検する</span>
          <span class="s-who">人</span>
        </div>
      </div>
      <div class="legend">
        <span>05 → 01　月次などでルールを更新して戻す</span>
      </div>
    </div>

    <div class="conclusion">
      <span class="c-label">集約</span>
      <span class="c-text">日々の処理はAIが回す。人の仕事は、最初の設計と、目的に照らした見直しだけになる</span>
      <span class="pageno">1 / 1</span>
    </div>
  </section>

</div>
</div>
</body>
</html>
