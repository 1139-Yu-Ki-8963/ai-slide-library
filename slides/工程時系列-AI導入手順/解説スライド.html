<style>
  html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--page); }

  :root {
    --page: #EDF0F4;
    --surface: #FFFFFF;
    --ink: #1C2B3A;
    --ink-2: #55667A;
    --ink-3: #8494A6;
    --border: #D9E0E8;
    --grid: #E4E9F0;
    --accent: #3b7dd8;
    --accent-deep: #2f66b3;
    --accent-soft: #EAF1FC;
  }

  .slide-viewport {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--page); overflow: hidden;
  }
  .slide {
    position: absolute;
    top: 50%; left: 50%;
    width: 1280px;
    height: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(28, 43, 58, 0.08);
    display: flex; flex-direction: column;
    padding: 40px 48px;
    gap: 20px;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    transform: translate(-50%, -50%) scale(var(--slide-scale, 1));
    transform-origin: center center;
  }

  /* ==== ヘッダ（青いアクセントバー付き） ==== */
  .slide-header {
    display: flex; gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header-accent-bar { flex: 0 0 5px; border-radius: 0; background: var(--accent-deep); }
  .header-text { display: flex; flex-direction: column; gap: 6px; }
  .slide-title { font-size: 28px; font-weight: 700; line-height: 1.3; color: var(--ink); text-wrap: balance; }
  .slide-desc { font-size: 14px; color: var(--ink-2); line-height: 1.6; }

  /* ==== 時系列全体 ==== */
  .timeline { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ==== 月ヘッダー行 ==== */
  .tl-months {
    display: flex;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .tl-months-spacer { flex: 0 0 240px; }
  .tl-months-right {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
  }
  .tl-month {
    font-size: 13px; font-weight: 700; color: var(--ink-3);
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* ==== 工程行 ==== */
  .tl-row {
    flex: 1;
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--border);
  }
  .tl-row:last-child { border-bottom: none; }

  .tl-row-left {
    flex: 0 0 240px;
    display: flex; flex-direction: column; gap: 6px;
    justify-content: center;
    padding: 8px 16px 8px 0;
  }
  .tl-process-tag {
    display: inline-block;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    font-size: 13px; font-weight: 700;
    padding: 4px 12px;
    border-radius: 4px;
  }
  .tl-desc { font-size: 12px; color: var(--ink-2); line-height: 1.55; }

  .tl-row-right {
    position: relative;
    flex: 1;
    background-image: linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 16.667% 100%;
  }

  /* ==== 矢印バー（先端三角形。CSS clip-path で描画） ==== */
  .tl-bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 30px;
    display: flex; align-items: center;
    padding: 0 16px 0 12px;
    background: var(--accent);
    border-left: 4px solid var(--accent-deep);
    color: #fff;
    font-size: 11px; font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
  }
  .tl-bar-start,
  .tl-bar-end {
    position: absolute;
    top: calc(50% + 22px);
    font-size: 10.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tl-bar-end { transform: translateX(-100%); }

  /* ==== メタデータフッター（区切り線 + 下端余白） ==== */
  .slide-meta {
    height: 18px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }
</style>
