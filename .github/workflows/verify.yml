name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout slide library
        uses: actions/checkout@v4

      - name: Checkout global slide skill
        uses: actions/checkout@v4
        with:
          repository: 1139-Yu-Ki-8963/agent-home
          path: .ci-agent-home
          ssh-key: ${{ secrets.AGENT_HOME_DEPLOY_KEY }}
          persist-credentials: false

      - name: Link global slide skill
        run: ln -s "$GITHUB_WORKSPACE/.ci-agent-home" "$HOME/agent-home"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify working tree before tests
        run: git diff --exit-code

      - name: Run slide gates
        run: npm test

      - name: Prove tests are read-only
        run: git diff --exit-code
